name: Refresh Instagram token

on:
  schedule:
    # Weekly, well inside the token's 60-day life, so a few missed runs are harmless
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Get a fresh 60-day token
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION || 'v25.0' }}
        run: npm run ig:refresh-token -- --out "$RUNNER_TEMP/ig-token"

      # GITHUB_TOKEN can't write secrets, hence the separate fine-grained token
      - name: Store it as the INSTAGRAM_ACCESS_TOKEN secret
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: |
          echo "::add-mask::$(cat "$RUNNER_TEMP/ig-token")"
          gh secret set INSTAGRAM_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/ig-token"
          rm -f "$RUNNER_TEMP/ig-token"
          echo "✓ Secret updated"
